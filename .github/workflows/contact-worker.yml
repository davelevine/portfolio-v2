# Tests the contact-form Worker on PRs that touch it, and deploys it from main.
# Secrets: CLOUDFLARE_API_TOKEN (Account: Workers Scripts: Edit only), CLOUDFLARE_ACCOUNT_ID.
name: Contact Worker

on:
  pull_request:
    paths: [worker/**, .github/workflows/contact-worker.yml]
  push:
    branches: [main]
    paths: [worker/**, .github/workflows/contact-worker.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: npm test
      - if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
